[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisteno"
version = "0.4.0"
description = "Reversible shorthand for Miahou-style AI memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
aisteno = "aisteno.cli:main"

[tool.setuptools]
packages = ["aisteno"]

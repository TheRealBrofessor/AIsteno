[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisteno"
version = "0.6.0"
description = "Reversible shorthand for Miahou-style AI memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
security = ["detect-secrets>=1.5"]
benchmark = ["tiktoken>=0.7", "transformers>=4.40"]
mcp = ["mcp>=1.0"]

[project.scripts]
aisteno = "aisteno.cli:main"

[tool.setuptools]
packages = ["aisteno"]
